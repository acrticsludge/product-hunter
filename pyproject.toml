[project]
name = "product-hunter"
version = "0.1.0"
description = "Product Hunter: evidence-driven pain point research."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1,<7",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "duckdb>=2.0.0",
]

[project.optional-dependencies]
embeddings = [
    "flagembedding>=1.3.0,<2",
    "huggingface-hub>=0.23,<1",
    "torch>=2.2",
]

[project.scripts]
ph = "product_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["uv_build>=0.9.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: live network/OpenCode integration test, skipped by default"]
