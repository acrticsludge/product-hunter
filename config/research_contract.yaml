budgets:
  per_run:
    browser_minutes: 30
    crawl_items: 500
    embedding_items: 999999
    fetch_requests: 999999
    llm_input_tokens: 9999999
    llm_output_tokens: 9999999
    model_calls: 999999
    search_queries: 999999
    subq_calls: 20
    tool_calls_total: 999999
    usd_cost: 25.0
    wall_time_seconds: 999999
  per_source:
    github_issues: 100
    hn_algolia: 200
  per_stage:
    clustering:
      embedding_items: 2000
    counter_evidence:
      search_queries: 20
    discovery:
      fetch_requests: 60
      search_queries: 40
    evidence_collection:
      fetch_requests: 80
      search_queries: 40
    investigation:
      llm_input_tokens: 9999999
      llm_output_tokens: 20000
      search_queries: 30
    normalization:
      llm_input_tokens: 9999999
      llm_output_tokens: 20000
      model_calls: 100
    scoring:
      llm_input_tokens: 9999999
      llm_output_tokens: 8000
    validation:
      llm_input_tokens: 9999999
      llm_output_tokens: 10000
      search_queries: 20
  soft_thresholds:
    fetch_requests: 0.8
    model_calls: 0.8
    search_queries: 0.8
    tool_calls_total: 0.8
    usd_cost: 0.8
    wall_time_seconds: 0.8
  version: phase4-v1
contract_version: phase4-v1
evidence_thresholds:
  clustering:
    min_neighbors_checked_per_cluster: 1
  competitor_search:
    min_candidate_urls: 10
    min_distinct_queries: 6
    min_query_families: 3
  counter_evidence:
    min_counter_evidence_items_or_explicit_zero: 1
    min_distinct_queries: 6
    min_query_families: 3
  discovery:
    min_distinct_queries: 8
    min_new_documents: 20
    min_source_domains: 3
  validation:
    min_evidence_spans: 20
    min_independent_authors: 1
    min_independent_communities: 3
    min_query_families: 4
hard_requirements:
  require_claim_evidence_links: true
  require_competitor_search: true
  require_counter_evidence: true
  require_duckdb_analysis: true
  require_provenance: true
  require_qdrant_check: true
promotion:
  require_all_stages_passed: true
  require_claim_evidence_links: true
  require_competitor_gate: true
  require_counter_evidence_gate: true
  require_quality_predicates: true
required_stages:
- discovery
- evidence_collection
- normalization
- clustering
- validation
- counter_evidence
- scoring
- investigation
retry:
  backoff_seconds: 5.0
  give_up_after_seconds: null
  max_retries: 2
  retry_on:
  - transient
  - timeout
stages:
  clustering:
    gate_key: clustering
    quality_checks:
    - nearest_neighbor_checked
    - duplicate_candidates_reviewed
    required_outputs:
    - cluster_assignments
    - similarity_checks
    - cluster_neighbors_checked
    - neighbor_check
    - duplicate_review
    required_tools:
    - qdrant
  counter_evidence:
    gate_key: counter_evidence
    quality_checks:
    - counter_evidence_present_or_explicit_zero
    - mandatory_query_families
    - known_query_families
    required_outputs:
    - counter_evidence
    required_tools:
    - search
  discovery:
    gate_key: discovery
    quality_checks:
    - non_empty_queries
    - source_diversity
    - mandatory_query_families
    - known_query_families
    required_outputs:
    - source_records
    - provenance
    - document
    required_tools:
    - search
  evidence_collection:
    gate_key: evidence_collection
    quality_checks: []
    required_outputs:
    - source_records
    - provenance
    required_tools:
    - fetch
  investigation:
    gate_key: competitor_search
    quality_checks:
    - mandatory_query_families
    - known_query_families
    required_outputs:
    - competitors
    - alternatives
    - counter_evidence
    - opportunity_score
    - confidence
    - candidate_url
    required_tools:
    - search
    - qdrant
    - duckdb
  normalization:
    gate_key: normalization
    quality_checks: []
    required_outputs:
    - normalized_records
    required_tools:
    - duckdb
  scoring:
    gate_key: scoring
    quality_checks: []
    required_outputs:
    - opportunity_score
    - confidence
    required_tools:
    - duckdb
  validation:
    gate_key: validation
    quality_checks:
    - non_empty_queries
    - mandatory_query_families
    - known_query_families
    required_outputs:
    - independent_source_count
    - independent_person_count
    - community_count
    - frequency_analysis
    - trend_analysis
    - evidence_summary
    - author
    - community
    - evidence_span
    required_tools:
    - search
    - qdrant
    - duckdb
stopping:
  max_consecutive_low_yield_batches: 3
  min_independent_authors: 10
  min_independent_communities: 3
  min_validation_query_families: 4
  saturation_threshold: 0
